<div class="card hover:shadow-md transition-shadow cursor-pointer"
     hx-get="{% url 'core:project_detail' project.pk %}"
     hx-push-url="true"
     hx-target="body"
     hx-swap="innerHTML">
    <div class="card-body">
        <div class="flex items-start justify-between">
            <div class="flex-1 min-w-0">
                <h3 class="text-lg font-semibold text-gray-900 truncate">
                    {{ project.name }}
                </h3>
                {% if project.description %}
                <p class="mt-1 text-sm text-gray-500 line-clamp-2">
                    {{ project.description }}
                </p>
                {% endif %}
            </div>
        </div>

        <div class="mt-4 flex items-center space-x-4 text-sm text-gray-500">
            <div class="flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                {{ project.assets.count }} assets
            </div>
            <div class="flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                {{ project.generations.count }} generations
            </div>
        </div>

        <div class="mt-4 text-xs text-gray-400">
            Updated {{ project.updated_at|timesince }} ago
        </div>
    </div>
</div>
