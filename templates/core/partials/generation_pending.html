<div class="card">
    <div class="card-body text-center py-8">
        <div class="mx-auto w-16 h-16 flex items-center justify-center">
            <svg class="animate-spin h-10 w-10 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <h3 class="mt-4 text-lg font-medium text-gray-900">Generating Designs</h3>
        <p class="mt-2 text-sm text-gray-500">
            Creating {{ generation.num_variations }} variation{{ generation.num_variations|pluralize }}...
        </p>
        <p class="mt-1 text-xs text-gray-400">This may take a minute</p>

        <!-- Progress bar placeholder -->
        <div class="mt-6 max-w-xs mx-auto">
            <div class="flex items-center space-x-2">
                <div class="flex-1 bg-gray-200 rounded-full h-2">
                    <div id="progress-bar"
                         class="bg-primary-500 h-2 rounded-full transition-all duration-300"
                         style="width: 0%"></div>
                </div>
                <span id="progress-text" class="text-sm text-gray-500">0%</span>
            </div>
            <p id="progress-message" class="mt-2 text-sm text-gray-500">Preparing...</p>
        </div>

        <!-- SSE connection for progress updates -->
        <div hx-ext="sse"
             sse-connect="{% url 'core:generation_stream' generation.pk %}"
             sse-swap="message"
             hx-target="#generation-results"
             hx-swap="innerHTML">
        </div>
    </div>
</div>

<script>
    // Fallback: poll for status if SSE fails
    (function() {
        const generationId = "{{ generation.pk }}";
        const statusUrl = "{% url 'core:generation_status' generation.pk %}";
        const resultsUrl = "{% url 'core:generation_results' generation.pk %}";

        const checkStatus = async () => {
            try {
                const response = await fetch(statusUrl);
                const data = await response.json();

                document.getElementById('progress-bar').style.width = `${data.progress}%`;
                document.getElementById('progress-text').textContent = `${data.progress}%`;
                document.getElementById('progress-message').textContent = data.message || 'Processing...';

                if (data.status === 'completed' || data.status === 'failed') {
                    // Load the results
                    const resultsResponse = await fetch(resultsUrl);
                    const resultsHtml = await resultsResponse.text();
                    document.getElementById('generation-results').innerHTML = resultsHtml;
                    return;
                }

                setTimeout(checkStatus, 2000);
            } catch (e) {
                setTimeout(checkStatus, 3000);
            }
        };

        // Start polling after a short delay
        setTimeout(checkStatus, 1000);
    })();
</script>
