<div class="card">
    <div class="card-body text-center py-8">
        <div class="mx-auto w-16 h-16 flex items-center justify-center">
            <svg class="animate-spin h-10 w-10 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <h3 class="mt-4 text-lg font-medium text-gray-900">Generating Designs</h3>
        <p class="mt-2 text-sm text-gray-500">
            Creating {{ generation.num_variations }} variation{{ generation.num_variations|pluralize }}...
        </p>
        <p class="mt-1 text-xs text-gray-400">This may take a minute</p>

        <!-- Progress bar placeholder -->
        <div class="mt-6 max-w-xs mx-auto">
            <div class="flex items-center space-x-2">
                <div class="flex-1 bg-gray-200 rounded-full h-2">
                    <div id="progress-bar"
                         class="bg-primary-500 h-2 rounded-full transition-all duration-300"
                         style="width: 0%"></div>
                </div>
                <span id="progress-text" class="text-sm text-gray-500">0%</span>
            </div>
            <p id="progress-message" class="mt-2 text-sm text-gray-500">Preparing...</p>
        </div>

        <!-- SSE connection for progress updates (uses JavaScript handler, not HTMX swap) -->
        <div id="sse-container"
             hx-ext="sse"
             sse-connect="{% url 'core:generation_stream' generation.pk %}">
        </div>
    </div>
</div>

<script>
    (function() {
        const resultsUrl = "{% url 'core:generation_results' generation.pk %}";
        const statusUrl = "{% url 'core:generation_status' generation.pk %}";
        let isComplete = false;

        // Update progress bar from data
        const updateProgress = (data) => {
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const progressMessage = document.getElementById('progress-message');

            if (progressBar) progressBar.style.width = `${data.progress}%`;
            if (progressText) progressText.textContent = `${data.progress}%`;
            if (progressMessage) progressMessage.textContent = data.message || 'Processing...';
        };

        // Load results when completed
        const loadResults = async () => {
            if (isComplete) return;
            isComplete = true;

            try {
                const resultsResponse = await fetch(resultsUrl);
                const resultsHtml = await resultsResponse.text();
                const resultsContainer = document.getElementById('generation-results');
                if (resultsContainer) {
                    resultsContainer.innerHTML = resultsHtml;
                    // Trigger HTMX to process any new content
                    if (window.htmx) htmx.process(resultsContainer);
                }
            } catch (e) {
                console.error('Failed to load results:', e);
            }
        };

        // Listen for SSE events from HTMX
        const sseContainer = document.getElementById('sse-container');
        if (sseContainer) {
            sseContainer.addEventListener('htmx:sseMessage', (event) => {
                try {
                    const data = JSON.parse(event.detail.data);
                    updateProgress(data);
                    if (data.status === 'completed' || data.status === 'failed') {
                        loadResults();
                    }
                } catch (e) {
                    console.error('Failed to parse SSE message:', e);
                }
            });
        }

        // Fallback polling in case SSE doesn't work
        const checkStatus = async () => {
            if (isComplete) return;

            try {
                const response = await fetch(statusUrl);
                const data = await response.json();
                updateProgress(data);

                if (data.status === 'completed' || data.status === 'failed') {
                    loadResults();
                    return;
                }

                setTimeout(checkStatus, 3000);
            } catch (e) {
                setTimeout(checkStatus, 5000);
            }
        };

        // Start polling after delay (SSE should update faster if it works)
        setTimeout(checkStatus, 2000);
    })();
</script>
