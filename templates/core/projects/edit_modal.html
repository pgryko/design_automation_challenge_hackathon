<div x-data="{ open: true }"
     x-show="open"
     x-on:keydown.escape.window="open = false; $el.remove()"
     class="relative z-50"
     aria-labelledby="modal-title"
     role="dialog"
     aria-modal="true">

    <!-- Background backdrop -->
    <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
         @click="open = false; $el.parentElement.remove()"></div>

    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div x-show="open"
                 x-transition:enter="ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                 x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
                 x-transition:leave="ease-in duration-200"
                 x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
                 x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
                 class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">

                <form hx-post="{% url 'core:project_edit' project.pk %}"
                      hx-target="body"
                      hx-swap="innerHTML"
                      @htmx:after-request="if(event.detail.successful) { open = false; }">
                    {% csrf_token %}

                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-primary-100 sm:mx-0 sm:h-10 sm:w-10">
                                <svg class="h-6 w-6 text-primary-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                                </svg>
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left flex-1">
                                <h3 class="text-lg font-semibold leading-6 text-gray-900" id="modal-title">
                                    Edit Project
                                </h3>
                                <div class="mt-4 space-y-4">
                                    <div>
                                        <label for="name" class="label">Project Name</label>
                                        <input type="text"
                                               name="name"
                                               id="name"
                                               class="input"
                                               value="{{ project.name }}"
                                               required
                                               autofocus>
                                    </div>
                                    <div>
                                        <label for="description" class="label">Description (optional)</label>
                                        <textarea name="description"
                                                  id="description"
                                                  rows="3"
                                                  class="input">{{ project.description }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="submit" class="btn-primary w-full sm:ml-3 sm:w-auto">
                            Save Changes
                        </button>
                        <button type="button"
                                class="btn-secondary mt-3 w-full sm:mt-0 sm:w-auto"
                                @click="open = false; $el.closest('[x-data]').remove()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
