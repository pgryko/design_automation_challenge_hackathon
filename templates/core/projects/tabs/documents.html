<div class="space-y-6">
    {% if error_message %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        <p class="text-sm">{{ error_message }}</p>
    </div>
    {% endif %}

    <!-- Add Document Form -->
    <div class="card">
        <div class="card-header">
            <h3 class="text-lg font-medium text-gray-900">Add Context Document</h3>
        </div>
        <form hx-post="{% url 'core:document_create' project.pk %}"
              hx-target="#document-list"
              hx-swap="innerHTML"
              hx-encoding="multipart/form-data"
              class="card-body space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label for="doc-title" class="label">Title</label>
                    <input type="text" name="title" id="doc-title" class="input" required placeholder="Feature Specification">
                </div>
                <div>
                    <label for="doc-type" class="label">Document Type</label>
                    <select name="doc_type" id="doc-type" class="input">
                        <option value="spec">Feature Specification</option>
                        <option value="guideline">UX/UI Guideline</option>
                        <option value="requirements">Requirements Document</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div x-data="{ mode: 'paste' }">
                <div class="flex space-x-4 mb-2">
                    <label class="inline-flex items-center">
                        <input type="radio" name="input_mode" value="paste" x-model="mode" class="text-primary-600">
                        <span class="ml-2 text-sm text-gray-700">Paste Text</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="input_mode" value="upload" x-model="mode" class="text-primary-600">
                        <span class="ml-2 text-sm text-gray-700">Upload File</span>
                    </label>
                </div>

                <div x-show="mode === 'paste'" x-cloak>
                    <label for="doc-content" class="label">Content</label>
                    <textarea name="content" id="doc-content" rows="6" class="input"
                              placeholder="Paste your document content here..."></textarea>
                </div>

                <div x-show="mode === 'upload'" x-cloak>
                    <label for="doc-file" class="label">File</label>
                    <input type="file" name="file" id="doc-file" accept=".txt,.md,.pdf,.docx,.pptx,.html,.htm" class="input">
                    <p class="mt-1 text-xs text-gray-500">Supports PDF, DOCX, PPTX, TXT, MD, HTML files</p>
                </div>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="btn-primary">Add Document</button>
            </div>
        </form>
    </div>

    <!-- Document List -->
    <div id="document-list">
        {% include "core/partials/document_list.html" %}
    </div>
</div>
